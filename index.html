<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <title>Prince Toadin</title>
  <meta name="description" content="Prince Toadin — a 2D pixel-art platformer for Android.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --text: #1c1a17;
      --muted: #5c574f;
      --line: #d8d2c6;
      --accent: #0b6b55;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --panel: #151b23;
        --text: #e8eef5;
        --muted: #94a2b3;
        --line: #283341;
        --accent: #7ee2a8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55;
    }
    main {
      width: min(560px, 100%);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 52px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }
    .lede {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 17px;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }
    a {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    a:hover, a:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
    }
    .note {
      margin: 26px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Android game</p>
    <h1>Prince Toadin</h1>
    <p class="lede">A short 2D pixel-art platformer. Jump, fight, and collect stars across the cave.</p>
    <nav aria-label="Site">
      <a href="privacy-policy.html">Privacy policy</a>
      <a href="app-ads.txt">app-ads.txt</a>
      <a href="mailto:rivandram0@gmail.com">Contact</a>
    </nav>
    <p class="note">This game shows ads. The privacy policy explains the data used by the ad SDK.</p>
  </main>
</body>
</html>
